name: Images

# ============================================================================
# GHCR container images (ADR-0059 P0.2):
#   ghcr.io/<owner>/cognia-signaling    services/signaling-server
#   ghcr.io/<owner>/cognia-share        services/share-server
#   ghcr.io/<owner>/cognia-diagnostics  services/diagnostic-server
#
# Each image builds with its own service directory as the Docker context.
#   - version tags (v*)  → semver tags + `latest` (what the app's self-host
#                          compose suite pulls by default)
#   - pushes to main     → `edge` + `sha-…`, so every merged change is pullable
#   - manual dispatch    → build, push only when `push` is ticked
#   - pull requests      → build only, never push
# PR builds read the GHA cache but never write it, so a fork PR can't poison
# what main and tag builds consume.
# ============================================================================

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      push:
        description: "Push images to GHCR"
        type: boolean
        default: false
  pull_request:
    paths:
      - "services/signaling-server/**"
      - "services/share-server/**"
      - "services/diagnostic-server/**"
      - "rust-toolchain.toml"
      - ".github/workflows/images.yml"

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  # Lowercase owner once — GHCR requires lowercase repository paths.
  vars:
    runs-on: ubuntu-latest
    outputs:
      owner: ${{ steps.o.outputs.owner }}
      should_push: ${{ steps.o.outputs.should_push }}
    steps:
      - id: o
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.push }}" = "true" ]; then
            echo "should_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_push=false" >> "$GITHUB_OUTPUT"
          fi

  image:
    name: ${{ matrix.name }}
    needs: vars
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cognia-signaling
            context: services/signaling-server
          - name: cognia-share
            context: services/share-server
          - name: cognia-diagnostics
            context: services/diagnostic-server
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: needs.vars.outputs.should_push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.vars.outputs.owner }}/${{ matrix.name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: ${{ needs.vars.outputs.should_push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,scope={0},mode=max', matrix.name) || '' }}
