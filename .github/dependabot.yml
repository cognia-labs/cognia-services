# Dependency updates. Every service is its own pnpm root or Cargo workspace,
# so each is listed on its own. Minor and patch updates are grouped into one
# weekly PR per unit; majors arrive one per PR. The cooldown lets a release
# age before it is proposed. Security updates ignore both settings.

version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/packages/status-contract"
      - "/packages/sync-protocol"
      - "/services/share-server/worker"
      - "/services/status-server/probe"
      - "/services/status-server/admin"
      - "/services/status-server/worker"
      - "/services/identity-server"
      - "/services/sync-server"
      - "/services/update-server/worker"
      - "/services/logto-email"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    directories:
      - "/services/signaling-server"
      - "/services/signaling-server/worker"
      - "/services/share-server"
      - "/services/diagnostic-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories:
      - "/services/signaling-server"
      - "/services/share-server"
      - "/services/diagnostic-server"
      - "/services/diagnostic-server/deploy"
      - "/services/status-server/probe/deploy"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/setup-package"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
